<div class="canned-drawer-v62" data-canned-drawer hidden>
  <div class="canned-drawer-head-v62">
    <strong>⚡ {{ 'Canned replies' if is_en else 'الردود الجاهزة' }}</strong>
    <button type="button" data-canned-close aria-label="Close">×</button>
  </div>
  <div class="canned-list-v62">
    {% for cr in canned_rows %}
      {% set reply = cr.item %}
      <button type="button" class="canned-item-v62" data-canned-card data-canned-text="{{ reply.body|e }}" data-canned-status="{{ cr.suggested_status }}" data-canned-action="insert">
        <strong>{{ reply.title }}</strong>
        <p>{{ reply.body|truncate(90) }}</p>
        <span class="canned-item-arrow-v62">↵</span>
      </button>
    {% else %}
      <p class="canned-empty-v62">{{ 'No canned replies yet.' if is_en else 'لا توجد ردود جاهزة بعد.' }}</p>
    {% endfor %}
  </div>
</div>
